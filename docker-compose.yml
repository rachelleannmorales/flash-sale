services:
  postgres:
    image: postgres:16-alpine
    container_name: flash-sale-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash
      POSTGRES_DB: flashsale
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash -d flashsale"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flash-sale-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: flash-sale-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      DATABASE_URL: postgres://flash:flash@postgres:5432/flashsale
      REDIS_URL: redis://redis:6379
      SALE_ID: ${SALE_ID:-demo-live3}
      TOTAL_STOCK: ${TOTAL_STOCK:-100}
      SALE_START: ${SALE_START:-2026-01-01T00:00:00.000Z}
      SALE_END: ${SALE_END:-2027-12-31T23:59:59.000Z}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-10}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-10 seconds}
    ports:
      - "3080:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 1s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: flash-sale-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  pg-data:
